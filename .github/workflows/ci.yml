name: Software checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  offline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: pip
      - name: Install reference CPU dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install --no-deps -e .
      - name: Verify distributed release files
        run: python scripts/release/verify.py
      - name: Verify published arithmetic
        run: python reproduction/verify_published_results.py
      - name: Offline software tests
        run: python -m pytest -q -m 'not slow and not anchor and not ray and not golden'
      - name: Shell syntax
        run: |
          while IFS= read -r path; do bash -n "$path"; done < <(git ls-files 'scripts/aws/*.sh' 'scripts/aws/**/*.sh')
