name: Strict H2prime numerical protocol gate
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  exact-golden:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: pip
      - run: python -m pip install -r requirements.txt
      - run: python -m pip install --no-deps -e .
      - name: Require the original canonical floating-point hash
        run: python -m pytest -q -m golden
